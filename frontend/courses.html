<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Courses | LearnHub - Learn Skills. Build Your Future.</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <a href="index.html" class="logo">
      <span class="logo-icon">L</span>
      Learn<span>Hub</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="courses.html" style="color: #34d399; font-weight: 600;">Courses</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="about.html">About</a>
    </nav>
    <div class="nav-actions">
      <a href="login.html" class="login-btn">Login</a>
      <a href="register.html" class="signup-btn">Get Started ↗</a>
    </div>
  </header>

  <main class="page-container">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-bottom: 25px;">
      <div>
        <p class="section-tag">COMPREHENSIVE CURRICULUM</p>
        <h1>Explore <span class="green-text">All Courses</span></h1>
        <p class="muted">Discover real, database-backed courses across 15 career fields.</p>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="filter-bar" style="display: flex; gap: 12px; flex-wrap: wrap; margin: 25px 0 35px;">
      <input id="courseSearch" type="search" placeholder="Search by title, keywords, or faculty..." style="flex: 2; min-width: 250px;">
      
      <select id="categoryFilter" style="flex: 1; min-width: 200px;">
        <option value="all">All Categories (15)</option>
      </select>

      <select id="levelFilter" style="flex: 1; min-width: 150px;">
        <option value="all">All Levels</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>
    </div>

    <!-- Dynamic Courses Grid -->
    <div id="coursesGrid" class="course-grid">
      <!-- Injected via courses.js from backend -->
    </div>
    <p id="coursesMessage" class="muted" style="margin-top: 15px;"></p>
  </main>

  <!-- Footer -->
  <footer class="footer" style="margin-top: 80px;">
    <a href="index.html" class="logo">
      <span class="logo-icon">L</span>
      Learn<span>Hub</span>
    </a>
    <p>Learn Skills. Build Your Future.</p>
    <span>© 2026 LearnHub. All rights reserved.</span>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/courses.js"></script>
</body>
</html>
