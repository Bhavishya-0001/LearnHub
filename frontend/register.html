<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | LearnHub - Learn Skills. Build Your Future.</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="index.html">
        <span class="logo-icon" style="display:inline-grid; width:28px; height:28px; border-radius:8px; background:#10b981; color:#04130e; font-size:16px; place-items:center; margin-right:6px; vertical-align:middle;">L</span>
        Learn<span>Hub</span>
      </a>
      <p class="eyebrow">START LEARNING TODAY</p>
      <h1>Create your account</h1>
      <p class="muted">Join thousands of students and build high-income, modern skills.</p>

      <form id="registerForm">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="e.g. Alex Johnson" required autocomplete="name">

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" placeholder="At least 8 characters" required autocomplete="new-password">

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" placeholder="Re-enter your password" required autocomplete="new-password">

        <p id="registerMessage" class="message" aria-live="polite"></p>
        <button class="primary-button" type="submit">Create account →</button>
      </form>

      <p class="switch-link">Already registered? <a href="login.html">Login</a></p>
      <a class="back-link" href="index.html">← Back to home</a>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
